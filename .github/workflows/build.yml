name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates *.tpz *.zip

      - name: Import project
        run: ~/godot/godot --headless --import 2>&1 | tee import.log; ! grep -q "SCRIPT ERROR" import.log

      - name: Smoke test (sector demo)
        run: timeout 120 ~/godot/godot --headless --quit-after 900 -- --sector 2>&1 | tee run.log; ! grep -qE "SCRIPT ERROR|ERROR:.*\.gd" run.log

      - name: Export Web
        run: mkdir -p build/web && ~/godot/godot --headless --export-release "Web" build/web/index.html

      - name: Export Windows
        run: mkdir -p build/windows && ~/godot/godot --headless --export-release "Windows Desktop" build/windows/VoidforgeAscension.exe

      - uses: actions/upload-artifact@v4
        with:
          name: VoidforgeAscension-windows
          path: build/windows

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
